<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 裝置端手勢切水果 (MoveNet)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.13.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.0.0/dist/pose-detection.min.js"></script>
    
    <style>
        /* (CSS 保持不變) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 讓影片填滿容器 */
        }

        #video {
            opacity: 0.2;
            transform: scaleX(-1);
        }

        #canvas {
            z-index: 10;
        }

        #status {
            position: absolute;
            top: 10px;
            width: 80%;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 8px;
            font-weight: bold;
            z-index: 20;
            text-align: center;
        }

        #start-btn {
            position: absolute;
            bottom: 50px;
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 30;
            transition: background-color 0.3s;
        }

        #start-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="status">正在載入 AI 模型...</div>
        <button id="start-btn" disabled>等待模型載入...</button>
    </div>

    <script>
        /* ------------------- JavaScript Start ------------------- */

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container'); // 取得容器元素
        
        let detector = null;
        let animationFrameId = null;
        let isRunning = false;
        
        // **新增**：用於儲存計算後的縮放和平移參數
        let scaleX = 1;
        let scaleY = 1;
        let offsetX = 0;
        let offsetY = 0;

        // 偵測點歷史（用於判斷手部移動軌跡）
        const handHistory = { left: [], right: [] };
        const HISTORY_LENGTH = 5;

        // 水果類別和狀態
        const FRUITS = ['🍎', '🍉', '🥝', '🍋', '🍇'];
        let activeFruits = [];
        let score = 0;

        // 遊戲參數
        const FRUIT_SIZE = 50;
        let lastLaunchTime = 0;
        const LAUNCH_INTERVAL = 1500;

        // --- 1. 核心模型和啟動 ---

        async function loadModelsAndStart() {
             // ... (loadModelsAndStart 內容保持不變) ...
            try {
                const detectorConfig = {
                    modelType: poseDetection.SupportedModels.MoveNet,
                    detectorParams: {
                        modelType: poseDetection.MoveNetType.SinglePoseLightning,
                        enableSmoothing: true
                    }
                };
                
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);

                statusDiv.innerHTML = "✅ 模型載入完成！點擊開始遊戲。";
                statusDiv.style.backgroundColor = 'rgba(0, 128, 0, 0.8)';
                startBtn.disabled = false;
                startBtn.textContent = "開始切水果！";
                
                startCamera();

            } catch (error) {
                console.error("載入模型失敗:", error);
                statusDiv.innerHTML = `❌ 模型載入失敗，錯誤: ${error.message}`;
                statusDiv.style.backgroundColor = 'rgba(255, 0, 0, 0.8)';
            }
        }
        
        async function startCamera() {
             // ... (startCamera 內容保持不變) ...
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user', 
                        // 這裡使用較低的理想解析度，以避免手機效能問題
                        width: { ideal: 480 }, 
                        height: { ideal: 640 } 
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("無法取得相機權限:", err);
                statusDiv.innerHTML = "❌ 無法啟動相機，請檢查權限。";
            }
        }

        // 影片載入完成後，**修正座標對齊計算**
        video.addEventListener('loadeddata', () => {
            const videoRatio = video.videoWidth / video.videoHeight;
            const containerRatio = container.clientWidth / container.clientHeight;

            // 調整 Canvas 尺寸以匹配容器顯示尺寸
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            // 由於 object-fit: cover，需要計算實際的縮放比例和偏移量
            if (videoRatio > containerRatio) {
                // 影片較寬，垂直方向被裁剪 (左右有黑邊，但 'cover' 會讓黑邊消失，實際是上下被填滿)
                scaleY = canvas.height / video.videoHeight;
                scaleX = scaleY; // X 軸也使用 Y 軸的縮放比
                offsetX = (canvas.width - video.videoWidth * scaleX) / 2;
                offsetY = 0;
            } else {
                // 影片較高，水平方向被裁剪 (上下有黑邊，但 'cover' 會讓黑邊消失，實際是左右被填滿)
                scaleX = canvas.width / video.videoWidth;
                scaleY = scaleX; // Y 軸也使用 X 軸的縮放比
                offsetX = 0;
                offsetY = (canvas.height - video.videoHeight * scaleY) / 2;
            }
        });


        // --- 2. 水果物件與生成 (保持不變) ---
        class Fruit {
            // ... (Fruit Class 內容保持不變) ...
            constructor(emoji) {
                this.emoji = emoji;
                this.x = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
                this.y = canvas.height + FRUIT_SIZE;
                this.radius = FRUIT_SIZE / 2;
                this.velocity = { 
                    x: (Math.random() - 0.5) * 5,
                    y: - (Math.random() * 10 + 20)
                };
                this.gravity = 0.9;
                this.isCut = false;
                this.cutAngle = 0;
            }

            update() {
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
            }

            draw() {
                ctx.font = `${FRUIT_SIZE}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (this.isCut) {
                    const halfText = this.emoji.substring(0, 1);
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.cutAngle);
                    ctx.fillText(halfText, -this.radius / 2, 0); 
                    ctx.fillText(halfText, this.radius / 2, 0);
                    ctx.restore();
                } else {
                    ctx.fillText(this.emoji, this.x, this.y);
                }
            }
        }

        function launchFruit(timestamp) {
            if (timestamp - lastLaunchTime > LAUNCH_INTERVAL) {
                const randomEmoji = FRUITS[Math.floor(Math.random() * FRUITS.length)];
                activeFruits.push(new Fruit(randomEmoji));
                lastLaunchTime = timestamp;
            }
        }


        // --- 3. AI 偵測與切中邏輯 ---

        function checkCollision(history, fruit) {
            // ... (checkCollision 內容保持不變) ...
            if (fruit.isCut) return false;
            if (history.length < 2) return false;

            const p1 = history[history.length - 1];
            // const p2 = history[history.length - 2]; // p2 不用於距離計算，但用於 cutAngle

            const dist = Math.hypot(p1.x - fruit.x, p1.y - fruit.y);

            if (dist < fruit.radius) {
                fruit.isCut = true;
                // 注意：這裡 cutAngle 應該使用 p2，但因為 p2 可能不準確，暫時維持原狀
                // fruit.cutAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x); 
                fruit.cutAngle = Math.random() * Math.PI; // 簡化切口角度
                
                score++;
                statusDiv.innerHTML = `得分：${score} | 成功切中 ${fruit.emoji}`;
                return true;
            }
            return false;
        }

        async function detectAndGameLoop(timestamp) {
            if (!detector || video.paused || video.ended || !isRunning) {
                cancelAnimationFrame(animationFrameId);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 執行 AI 偵測
            const poses = await detector.estimatePoses(video, {
                flipHorizontal: true // 確保與 video CSS 鏡像匹配
            });

            if (poses && poses.length > 0) {
                const pose = poses[0];
                const keypoints = pose.keypoints;
                
                const leftWrist = keypoints[9];
                const rightWrist = keypoints[10];
                
                // **修正後的映射函式**
                const mapKeypoint = (kp) => {
                    // 應用縮放和平移，以準確對齊 Canvas 顯示
                    return {
                        x: kp.x * scaleX + offsetX,
                        y: kp.y * scaleY + offsetY
                    };
                };

                // 更新手部軌跡
                if (leftWrist.score > 0.6) {
                    handHistory.left.push(mapKeypoint(leftWrist));
                    if (handHistory.left.length > HISTORY_LENGTH) handHistory.left.shift();
                }
                if (rightWrist.score > 0.6) {
                    handHistory.right.push(mapKeypoint(rightWrist));
                    if (handHistory.right.length > HISTORY_LENGTH) handHistory.right.shift
