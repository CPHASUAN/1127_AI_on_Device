<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 裝置端表情測謊機 (Demo)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.13.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
    <style>
        /* ------------------- CSS Start ------------------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #status, #result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
        }

        #status {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        #result {
            background-color: #e9ecef;
            color: #0056b3;
            min-height: 50px;
        }
        
        .lie-detected {
            background-color: #ffcccc !important;
            color: #dc3545 !important;
            border: 1px solid #f5c6cb !important;
        }

        .truth-detected {
            background-color: #d4edda !important;
            color: #155724 !important;
            border: 1px solid #c3e6cb !important;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.0em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1e7e34;
        }
        
        /* 隱藏模型載入進度條 (可選) */
        .progress-bar-container {
            margin-top: 10px;
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #007bff;
            width: 0%;
            transition: width 0.3s;
        }

        /* ------------------- CSS End ------------------- */
    </style>
</head>
<body>

    <header>
        <h1>🤖 裝置端表情測謊演示</h1>
    </header>

    <main>
        <p>此應用程式利用 **TensorFlow.js** 在您的裝置上執行表情辨識模型，實現**完全離線**的 AI 判斷。</p>
        
        <div id="status">
            載入中... 請稍候 (第一次載入模型需時間)
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <button id="start-btn" disabled>啟動 AI 辨識</button>

        <div id="result">
            等待啟動...
        </div>
    </main>

    <script>
        /* ------------------- JavaScript Start ------------------- */

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const startBtn = document.getElementById('start-btn');
        const progressBar = document.getElementById('progress-bar');
        
        let detectionInterval;
        let isModelLoaded = false;
        
        // --- 1. 模型路徑設定 ---
        // face-api.js 的預設模型放在這個資料夾。
        // 請確保在 GitHub Pages 專案的根目錄下有 'models' 資料夾，並包含以下檔案：
        // - tiny_face_detector_model-weights_manifest.json (and associated files)
        // - face_expression_model-weights_manifest.json (and associated files)
        const MODEL_URL = '/models'; 
        
        // --- 2. 測謊邏輯 (請注意：這是演示，非科學依據) ---
        // 我們假設某些「高強度」或「非典型」的表情可能與欺騙相關
        const LIE_INDICATOR_EXPRESSIONS = ['surprised', 'fearful', 'disgusted'];
        const DETECTION_INTERVAL_MS = 300; // 每 300 毫秒進行一次辨識

        // --- 3. 載入模型和媒體流 ---

        async function loadModelsAndStart() {
            statusDiv.innerHTML = "正在載入模型，請稍候...";
            startBtn.disabled = true;

            try {
                // 載入臉部偵測模型 (TinyFaceDetector)
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                progressBar.style.width = '30%';

                // 載入臉部表情辨識模型
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
                progressBar.style.width = '60%';
                
                // 載入臉部地標模型 (輔助用，可選)
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                progressBar.style.width = '100%';

                isModelLoaded = true;
                statusDiv.innerHTML = "✅ 模型載入完成！現在可切換至**飛航模式**運行。";
                statusDiv.classList.add('truth-detected');
                startBtn.disabled = false;
                startBtn.textContent = "點擊啟動測謊";
                
                // 啟動相機
                startCamera();

            } catch (error) {
                console.error("載入模型失敗:", error);
                statusDiv.innerHTML = `❌ 模型載入失敗，請檢查 ${MODEL_URL} 路徑是否正確，或網路連線。錯誤: ${error.message}`;
                statusDiv.classList.add('lie-detected');
            }
        }
        
        // 啟動相機並取得影片串流
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
                video.srcObject = stream;
            } catch (err) {
                console.error("無法取得相機權限:", err);
                statusDiv.innerHTML = "❌ 無法啟動相機，請檢查權限。";
                statusDiv.classList.add('lie-detected');
            }
        }

        // 影片載入完成後，調整 Canvas 大小
        video.addEventListener('loadedmetadata', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
        });

        // --- 4. 表情辨識與測謊核心邏輯 ---

        function startDetection() {
            if (!isModelLoaded) return;

            startBtn.disabled = true;
            startBtn.textContent = "AI 正在分析...";
            statusDiv.innerHTML = "AI 正在即時分析您的表情...";
            statusDiv.classList.remove('truth-detected');
            statusDiv.classList.remove('lie-detected');

            detectionInterval = setInterval(async () => {
                if (video.paused || video.ended) {
                    clearInterval(detectionInterval);
                    return;
                }
                
                // 進行臉部偵測和表情辨識
                const detections = await faceapi.detectSingleFace(
                    video, 
                    new faceapi.TinyFaceDetectorOptions()
                ).withFaceExpressions();
                
                // 清空畫布
                overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);

                if (detections) {
                    // 繪製臉部框線
                    const resizedDetections = faceapi.resizeResults(detections, { width: video.videoWidth, height: video.videoHeight });
                    faceapi.draw.drawDetections(overlay, resizedDetections);
                    
                    // 取得最有可能的表情
                    const expressions = detections.expressions;
                    if (expressions) {
                        const highestProbabilityExpression = Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b);
                        const probability = expressions[highestProbabilityExpression];

                        // 判斷是否為「測謊指示表情」
                        if (LIE_INDICATOR_EXPRESSIONS.includes(highestProbabilityExpression) && probability > 0.6) {
                            // 判斷為「說謊」
                            resultDiv.innerHTML = `⚠️ 測謊結果：**欺騙跡象**！檢測到表情：**${highestProbabilityExpression}** (${(probability * 100).toFixed(1)}%)`;
                            resultDiv.classList.add('lie-detected');
                            resultDiv.classList.remove('truth-detected');
                        } else {
                            // 判斷為「誠實/中性」
                            resultDiv.innerHTML = `✅ 測謊結果：**誠實或中性**。目前表情：**${highestProbabilityExpression}** (${(probability * 100).toFixed(1)}%)`;
                            resultDiv.classList.add('truth-detected');
                            resultDiv.classList.remove('lie-detected');
                        }
                    }
                } else {
                    resultDiv.innerHTML = '請將臉部對準鏡頭...';
                    resultDiv.classList.remove('lie-detected');
                    resultDiv.classList.remove('truth-detected');
                }
            }, DETECTION_INTERVAL_MS);
        }

        // 停止偵測 (目前應用中不需要，但寫法供參考)
        /*
        function stopDetection() {
            clearInterval(detectionInterval);
            startBtn.disabled = false;
            startBtn.textContent = "啟動 AI 辨識";
        }
        */

        // --- 5. 事件監聽器與初始化 ---
        
        startBtn.addEventListener('click', () => {
             if (detectionInterval) {
                 clearInterval(detectionInterval); // 避免重複啟動
             }
             startDetection();
        });
        
        // 初始化：載入模型並嘗試啟動相機
        loadModelsAndStart(); 

        /* ------------------- JavaScript End ------------------- */
    </script>
</body>
</html>
