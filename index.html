<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 裝置端深蹲計數器 (MoveNet Demo)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.13.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.0.0/dist/pose-detection.min.js"></script>
    
    <style>
        /* ------------------- CSS Start ------------------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation; /* 增強手機操作體驗 */
        }

        header {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background-color: #000;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* 鏡像顯示，讓使用者感覺像照鏡子 */
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #status, #counter-display {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
        }

        #status {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        #counter-display {
            background-color: #d4edda;
            color: #155724;
            font-size: 2.5em;
            padding: 20px;
        }
        
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1e7e34;
        }

        .disabled-btn {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        
        /* ------------------- CSS End ------------------- */
    </style>
</head>
<body>

    <header>
        <h1>🏋️ 裝置端 AI 深蹲計數器</h1>
    </header>

    <main>
        <p>此應用程式利用 **TensorFlow.js MoveNet** 模型，在您的裝置上執行姿勢辨識，實現**完全離線**的運動計數。</p>
        
        <div id="status">載入中... 請稍候 (第一次載入模型需時間)</div>

        <div id="counter-display">深蹲次數：0</div>

        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <button id="start-btn" class="disabled-btn" disabled>啟動 AI 偵測</button>

    </main>

    <script>
        /* ------------------- JavaScript Start ------------------- */

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const counterDisplay = document.getElementById('counter-display');
        const startBtn = document.getElementById('start-btn');
        const ctx = canvas.getContext('2d');
        
        let detector;
        let animationFrameId;
        let isRunning = false;
        
        // --- 1. 深蹲計數狀態機 ---
        let squatCount = 0;
        let squatState = 'stand'; // 'stand' (站立) 或 'squat' (深蹲)
        
        // --- 2. 模型設定 ---
        const MODEL_URL = 'https://tfhub.dev/google/tfjs-model/movenet/singlepose/lightning/3';
        
        // 取得兩條線段之間夾角的函式 (用於判斷膝蓋角度)
        function getAngle(keypointA, keypointB, keypointC) {
            const angleRad = Math.atan2(keypointC.y - keypointB.y, keypointC.x - keypointB.x) - 
                             Math.atan2(keypointA.y - keypointB.y, keypointA.x - keypointB.x);
            let angleDeg = Math.abs(angleRad * 180.0 / Math.PI);
            
            // 確保角度在 0 到 360 度之間
            if (angleDeg > 180) {
                angleDeg = 360 - angleDeg;
            }
            return angleDeg;
        }

        // --- 3. 載入模型和媒體流 ---

        async function loadModelsAndStart() {
            statusDiv.innerHTML = "正在載入 MoveNet 模型... (第一次載入需時間)";
            startBtn.disabled = true;

            try {
                const detectorConfig = {
                    modelType: poseDetection.SupportedModels.MoveNet,
                    // 'SinglePose.Lightning' 是最快且最輕量級的版本，適合手機
                    modelUrl: MODEL_URL, 
                    detectorParams: {
                        modelType: poseDetection.MoveNetType.SinglePoseLightning,
                        enableSmoothing: true // 啟用平滑處理，讓動作更穩定
                    }
                };
                
                // 載入姿勢偵測器 (這一步完成後即可離線運行)
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);

                statusDiv.innerHTML = "✅ 模型載入完成！現在可切換至**飛航模式**運行。";
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                startBtn.disabled = false;
                startBtn.classList.remove('disabled-btn');
                startBtn.textContent = "點擊啟動偵測";
                
                // 啟動相機
                startCamera();

            } catch (error) {
                console.error("載入模型失敗:", error);
                statusDiv.innerHTML = `❌ 模型載入失敗，請檢查網路連線或模型路徑。錯誤: ${error.message}`;
                statusDiv.style.backgroundColor = '#ffcccc';
                statusDiv.style.color = '#dc3545';
            }
        }
        
        // 啟動相機
        async function startCamera() {
            try {
                // 盡量使用後鏡頭 (environment) 以獲得更好的姿勢追蹤，若不成功則使用前鏡頭 (user)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user', // 手機預設使用前鏡頭
                        width: 320, 
                        height: 240 
                    } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("無法取得相機權限:", err);
                statusDiv.innerHTML = "❌ 無法啟動相機，請檢查權限。";
            }
        }

        // 影片載入完成後，調整 Canvas 大小
        video.addEventListener('loadeddata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        // --- 4. 偵測循環與計數核心邏輯 ---

        async function detectAndCount() {
            if (!detector || video.paused || video.ended || !isRunning) {
                cancelAnimationFrame(animationFrameId);
                return;
            }

            // 實施 AI 偵測
            const poses = await detector.estimatePoses(video, {
                flipHorizontal: true // 由於 video 已經鏡像，這裡設為 true 以匹配座標
            });
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (poses && poses.length > 0) {
                const pose = poses[0]; // 追蹤第一個人
                
                // 繪製骨架
                drawKeypoints(pose.keypoints);
                drawSkeleton(pose.keypoints);
                
                // 進行深蹲計數邏輯
                countSquat(pose.keypoints);
            }

            animationFrameId = requestAnimationFrame(detectAndCount);
        }
        
        // 深蹲計數邏輯
        function countSquat(keypoints) {
            // 需要的關鍵點索引 (MoveNet 模型定義)
            const RIGHT_HIP = 12;
            const RIGHT_KNEE = 14;
            const RIGHT_ANKLE = 16;
            
            const LEFT_HIP = 11;
            const LEFT_KNEE = 13;
            const LEFT_ANKLE = 15;
            
            // 確保關鍵點的可信度夠高
            const minConfidence = 0.3; 
            if (keypoints[RIGHT_HIP].score < minConfidence || keypoints[RIGHT_KNEE].score < minConfidence || keypoints[RIGHT_ANKLE].score < minConfidence) {
                // 如果偵測不到，則忽略本次計算
                return;
            }

            // 計算膝蓋的角度 (大腿-膝蓋-小腿 的夾角)
            const rightKneeAngle = getAngle(keypoints[RIGHT_HIP], keypoints[RIGHT_KNEE], keypoints[RIGHT_ANKLE]);
            const leftKneeAngle = getAngle(keypoints[LEFT_HIP], keypoints[LEFT_KNEE], keypoints[LEFT_ANKLE]);
            
            // 取兩邊膝蓋角度的平均值作為判斷依據
            const kneeAngle = (rightKneeAngle + leftKneeAngle) / 2;

            // --- 狀態轉換 ---
            // 站立狀態：膝蓋角度接近 180 度
            const STAND_ANGLE = 165; 
            // 深蹲狀態：膝蓋角度小於 100~120 度
            const SQUAT_ANGLE = 120; 

            if (kneeAngle < SQUAT_ANGLE && squatState === 'stand') {
                // 從站立 -> 轉換到深蹲
                squatState = 'squat';
                statusDiv.innerHTML = "動作中... (蹲下)";
                statusDiv.style.backgroundColor = '#fff3cd';
                statusDiv.style.color = '#856404';

            } else if (kneeAngle > STAND_ANGLE && squatState === 'squat') {
                // 從深蹲 -> 轉換到站立 -> 完成一次深蹲
                squatState = 'stand';
                squatCount++;
                counterDisplay.innerHTML = `深蹲次數：${squatCount}`;
                statusDiv.innerHTML = "🎉 動作完成！ (站立)";
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
            }
        }
        
        // --- 5. 繪圖函式 (將結果畫到 Canvas 上) ---
        
        // 繪製關鍵點 (關節)
        function drawKeypoints(keypoints) {
            ctx.fillStyle = 'red';
            keypoints.forEach(point => {
                if (point.score > 0.4) {
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 5, 0, 2 * Math.
