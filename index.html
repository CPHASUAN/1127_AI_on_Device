<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 裝置端深蹲計數器 (MoveNet Demo)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.13.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.0.0/dist/pose-detection.min.js"></script>
    
    <style>
        /* (CSS 保持不變，但新增一個給切換按鈕的樣式) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        main {
            padding: 20px;
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background-color: #000;
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* 鏡像顯示 */
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #status, #counter-display {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
        }

        #status {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        #counter-display {
            background-color: #d4edda;
            color: #155724;
            font-size: 2.5em;
            padding: 20px;
        }
        
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: #1e7e34;
        }

        .disabled-btn {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        #flip-camera-btn {
            background-color: #007bff;
            padding: 10px 15px;
            font-size: 0.9em;
        }
        
        #flip-camera-btn:hover:not(:disabled) {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏋️ 裝置端 AI 深蹲計數器</h1>
    </header>

    <main>
        <p>此應用程式利用 **TensorFlow.js MoveNet** 模型，在您的裝置上執行姿勢辨識，實現**完全離線**的運動計數。</p>
        
        <div id="status">載入中... 請稍候 (第一次載入模型需時間)</div>

        <div id="counter-display">深蹲次數：0</div>

        <div id="video-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <div id="controls">
            <button id="start-btn" class="disabled-btn" disabled>啟動 AI 偵測</button>
            <button id="flip-camera-btn" disabled>切換鏡頭</button>
        </div>

    </main>

    <script>
        /* ------------------- JavaScript Start ------------------- */

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusDiv = document.getElementById('status');
        const counterDisplay = document.getElementById('counter-display');
        const startBtn = document.getElementById('start-btn');
        const flipCameraBtn = document.getElementById('flip-camera-btn'); // 新增按鈕
        const ctx = canvas.getContext('2d');
        
        let detector;
        let animationFrameId;
        let isRunning = false;
        let currentFacingMode = 'user'; // 預設使用前鏡頭 (user)
        
        // --- 1. 深蹲計數狀態機 ---
        let squatCount = 0;
        let squatState = 'stand'; // 'stand' (站立) 或 'squat' (深蹲)
        
        // --- 2. 模型設定 ---
        const MODEL_URL = 'https://tfhub.dev/google/tfjs-model/movenet/singlepose/lightning/3';
        
        // 取得兩條線段之間夾角的函式 (用於判斷膝蓋角度)
        function getAngle(keypointA, keypointB, keypointC) {
            const angleRad = Math.atan2(keypointC.y - keypointB.y, keypointC.x - keypointB.x) - 
                             Math.atan2(keypointA.y - keypointB.y, keypointA.x - keypointB.x);
            let angleDeg = Math.abs(angleRad * 180.0 / Math.PI);
            
            if (angleDeg > 180) {
                angleDeg = 360 - angleDeg;
            }
            return angleDeg;
        }

        // --- 3. 載入模型和媒體流 ---

        async function loadModelsAndStart() {
            statusDiv.innerHTML = "正在載入 MoveNet 模型... (第一次載入需時間)";
            startBtn.disabled = true;
            flipCameraBtn.disabled = true;

            try {
                const detectorConfig = {
                    modelType: poseDetection.SupportedModels.MoveNet,
                    modelUrl: MODEL_URL, 
                    detectorParams: {
                        modelType: poseDetection.MoveNetType.SinglePoseLightning,
                        enableSmoothing: true
                    }
                };
                
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);

                statusDiv.innerHTML = "✅ 模型載入完成！現在可切換至**飛航模式**運行。";
                statusDiv.style.backgroundColor = '#d4edda';
                statusDiv.style.color = '#155724';
                startBtn.disabled = false;
                flipCameraBtn.disabled = false; // 模型載完才能切鏡頭
                startBtn.classList.remove('disabled-btn');
                startBtn.textContent = "點擊啟動偵測";
                
                // 啟動相機 (使用預設鏡頭 'user')
                startCamera(currentFacingMode);

            } catch (error) {
                console.error("載入模型失敗:", error);
                statusDiv.innerHTML = `❌ 模型載入失敗，請檢查網路連線或模型路徑。錯誤: ${error.message}`;
                statusDiv.style.backgroundColor = '#ffcccc';
                statusDiv.style.color = '#dc3545';
            }
        }
        
        // 啟動相機 (優化後版本：可指定鏡頭)
        async function startCamera(facingMode) {
            // 停止現有的影片流
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: facingMode, // 使用傳入的鏡頭模式
                        width: { ideal: 320 }, 
                        height: { ideal: 240 } 
                    } 
                });
                video.srcObject = stream;
                currentFacingMode = facingMode; // 更新當前鏡頭模式
                
                // 根據鏡頭模式調整鏡像效果
                if (facingMode === 'user') {
                    // 前鏡頭：鏡像 (模擬照鏡子)
                    video.style.transform = 'scaleX(-1)'; 
                } else {
                    // 後鏡頭：不鏡像 (顯示真實方向)
                    video.style.transform = 'scaleX(1)';
                }

            } catch (err) {
                console.error(`無法取得 ${facingMode === 'user' ? '前置' : '後置'} 相機權限:`, err);
                statusDiv.innerHTML = `❌ 無法啟動 ${facingMode === 'user' ? '前置' : '後置'} 相機，請檢查權限。`;
            }
        }

        // 影片載入完成後，調整 Canvas 大小
        video.addEventListener('loadeddata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        });

        // --- 4. 偵測循環與計數核心邏輯 ---

        async function detectAndCount() {
            if (!detector || video.paused || video.ended || !isRunning) {
                cancelAnimationFrame(animationFrameId);
                return;
            }
            
            // 實施 AI 偵測
            const poses = await detector.estimatePoses(video
